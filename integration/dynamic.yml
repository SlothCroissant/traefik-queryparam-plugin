http:
  routers:
    matched:
      rule: PathPrefix(`/matched`)
      entryPoints:
        - web
      middlewares:
        - add-query-parameters
      service: whoami
    unmatched:
      rule: PathPrefix(`/unmatched`)
      entryPoints:
        - web
      service: whoami

  middlewares:
    add-query-parameters:
      plugin:
        QueryParamsPlugin:
          addQueryParams:
            added: plugin
            replace: configured
            special: space & symbols
          removeQueryParams:
            - key: remove
              value: first
            - key: remove-all

  services:
    whoami:
      loadBalancer:
        servers:
          - url: http://whoami:80
