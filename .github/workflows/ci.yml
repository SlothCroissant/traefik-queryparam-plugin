name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  conventional-commit:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "${TITLE}" =~ ^(feat|fix|perf|docs|refactor|test|build|ci|chore|style)(\([^)]+\))?(!)?:\ .+ ]]; then
            echo "PR title must follow Conventional Commits, for example: feat: add middleware option" >&2
            exit 1
          fi

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            printf 'The following files are not formatted:\n%s\n' "${unformatted}"
            exit 1
          fi
      - name: Run vet
        run: go vet ./...
      - name: Run unit tests
        run: go test -race -cover ./...

  integration:
    name: Traefik integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Test with Traefik
        run: bash integration/run.sh
