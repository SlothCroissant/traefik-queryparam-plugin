name: Release

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Use the triggering commit
        run: git reset --hard "${{ github.sha }}"
      - name: Semantic Versioning
        id: release
        uses: python-semantic-release/python-semantic-release@v10.6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          changelog: "false"
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"

  prerelease:
    if: github.event_name == 'pull_request'
    name: Calculate prerelease
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request head
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Create a local pull request branch
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git switch --force-create "pr/${PR_NUMBER}" "${PR_HEAD_SHA}"
      - name: Calculate prerelease version
        id: prerelease
        uses: python-semantic-release/python-semantic-release@v10.6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          no_operation_mode: "true"
          prerelease: "true"
          prerelease_token: "pr"
          build_metadata: ${{ github.event.pull_request.head.sha }}
          build: "false"
          changelog: "false"
      - name: Write calculated version summary
        env:
          VERSION: ${{ steps.prerelease.outputs.version }}
        run: |
          {
            echo "## Calculated prerelease version"
            echo
            echo "\`${VERSION}\`"
            echo
            echo "This validation is read-only; it does not create a tag or GitHub release."
          } >> "$GITHUB_STEP_SUMMARY"
