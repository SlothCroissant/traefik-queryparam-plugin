name: Release

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Use the triggering commit
        run: git reset --hard "${{ github.sha }}"
      - name: Semantic Versioning
        id: release
        uses: python-semantic-release/python-semantic-release@v10.6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          changelog: "false"
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"

  prerelease:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    name: Publish prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: prerelease-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    outputs:
      released: ${{ steps.prerelease.outputs.released }}
      tag: ${{ steps.prerelease.outputs.tag }}
    steps:
      - name: Check out pull request head
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Create a local pull request branch
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git switch --force-create "pr/${PR_NUMBER}" "${PR_HEAD_SHA}"
      - name: Publish prerelease version
        id: prerelease
        uses: python-semantic-release/python-semantic-release@v10.6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: "true"
          prerelease_token: "pr"
          build_metadata: ${{ github.event.pull_request.head.sha }}
          build: "false"
          changelog: "false"
          commit: "false"
      - name: Write prerelease summary
        env:
          VERSION: ${{ steps.prerelease.outputs.version }}
        run: |
          {
            echo "## Published prerelease"
            echo
            echo "\`${VERSION}\`"
            echo
            echo "This GitHub release is marked as a prerelease and is tagged at the pull request head commit."
          } >> "$GITHUB_STEP_SUMMARY"

  remote-plugin-integration:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.prerelease.outputs.released == 'true'
    name: Test published Traefik plugin
    needs: prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out pull request head
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Test Traefik registry plugin
        env:
          TRAEFIK_REMOTE_PLUGIN_VERSION: ${{ needs.prerelease.outputs.tag }}
        run: bash integration/run.sh
